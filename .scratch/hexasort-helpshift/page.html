        {"platform_id":"algames_platform_20240129201332045-7e197bedd0b9c2c","platform_type":"ios","sections":[{"id":"algames_section_20240129201331904-e1ece6570e036f6","title":"Gameplay","faqs":[{"id":"algames_faq_20250227030002450-e9bb5e61bc24a5b","title":"Terms of Use and Privacy Policy","body":"<p>To access our Terms of Use and Privacy Policy, you can visit the links below:</p><ul><li>Terms of Use:&nbsp;<a href=\"https://lionstudios.cc/terms/\" target=\"_blank\" rel=\"nofollow\">https://lionstudios.cc/terms/</a></li><li>Privacy Policy:&nbsp;<a href=\"https://lionstudios.cc/privacy/\" target=\"_blank\" rel=\"nofollow\">https://lionstudios.cc/privacy/</a></li>\n</ul>","description":"To access our Terms of Use and Privacy Policy, you can visit the links below:Terms of Use:&nbsp;https://lionstudios.cc/terms/Privacy Policy:...","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/faq/2688/?p=ios","aria_label":"Article link to Terms of Use and Privacy Policy from section Gameplay link"}],"publish_id":"316","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/section/316/?p=ios","icon":"📚"},{"id":"algames_section_20241222035339559-4f34c09b8c29829","title":"Special Tiles","faqs":[{"id":"algames_faq_20250730174152099-a07629eb60de3aa","title":"What is a Popcorn Tile?","body":"<ul><li>Popcorn is a special tile type unlocked at level 1111.</li><li>The goal is to create popcorn by merging tiles next to the popcorn machine and then collect all the popcorn boxes.</li><li>The popcorn machine displays the number of tiles required to create the popcorn.</li><li>Once the required number of tiles is merged, the popcorn machine disappears and 3 random popcorn boxes are placed on the board.</li><li>You can merge tiles anywhere on the board to create the popcorn.</li><li>After the popcorn is created, merge next to a popcorn box to collect it.</li> </ul><p><a href=\"https://d2duuy9yo5pldo.cloudfront.net/algames/f6b76838-f0ed-4f5c-9535-10109c3a9937.gif\" target=\"_blank\" data-lightbox=\"true\" rel=\"nofollow\"><img src=\"https://d2duuy9yo5pldo.cloudfront.net/algames/f6b76838-f0ed-4f5c-9535-10109c3a9937.gif\" srcset=\"https://d2duuy9yo5pldo.cloudfront.net/algames/f6b76838-f0ed-4f5c-9535-10109c3a9937.gif 1x, https://d2duuy9yo5pldo.cloudfront.net/algames/f6b76838-f0ed-4f5c-9535-10109c3a9937.gif 1.5x\" alt=\"\"> </a></p>","description":"Popcorn is a special tile type unlocked at level 1111.The goal is to create popcorn by merging tiles next to the popcorn machine and then co...","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/faq/2923/?p=ios","aria_label":"Article link to What is a Popcorn Tile? from section Special Tiles link"}],"publish_id":"411","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/section/411/?p=ios"},{"id":"algames_section_20240129201331927-8044720aef6938a","title":"Account","faqs":[{"id":"algames_faq_20240130215450669-2e468838bc23d34","title":"How do I connect my game to my Facebook Account?","body":"<p>The feature is currently in-active and under development. Shall be implemented soon.</p>","description":"The feature is currently in-active and under development. Shall be implemented soon.","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/faq/1665/?p=ios","aria_label":"Article link to How do I connect my game to my Facebook Account? from section Account link"}],"publish_id":"317","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/section/317/?p=ios","icon":"👩🏻"},{"id":"algames_section_20240129201331954-3b24ed705079e4d","title":"Billing","faqs":[{"id":"algames_faq_20240130223635724-198b78576d4c77c","title":"How do I cancel my accidental purchase?","body":"<p>Android: If you are an Android user, kindly send us a screenshot of your Google Purchase Receipt. This will enable us to promptly investigate and process a refund.</p><p>iOS: If you are playing our game on an Apple device, please be informed that we are unable to process refunds directly, as the Apple Store manages all transactions. In this event, we kindly ask you to reach out to Apple Support for assistance in initiating the refund process.</p><p>To prevent unintentional or unauthorized future purchases, we recommend visiting the following links to learn how to set restrictions on your device:</p><ul><li><a href=\"https://support.google.com/googleplay/answer/1626831?hl=en\" target=\"_blank\" rel=\"nofollow\">Android</a></li><li><a href=\"https://support.apple.com/en-us/102470\" target=\"_blank\" rel=\"nofollow\">iOS</a></li> </ul><p>Implementing these restrictions add an extra layer of security and control over your in-app purchases, ensuring a more secure and enjoyable gaming experience.</p><p>We appreciate your understanding and cooperation in this matter. If you have any further questions or concerns, please feel free to reach out to our support team.</p>","description":"Android: If you are an Android user, kindly send us a screenshot of your Google Purchase Receipt. This will enable us to promptly investigat...","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/faq/1676/?p=ios","aria_label":"Article link to How do I cancel my accidental purchase? from section Billing link"}],"publish_id":"318","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/section/318/?p=ios","icon":"💰"},{"id":"algames_section_20240129201331988-78f8b92e287f50f","title":"Settings","faqs":[{"id":"algames_faq_20240130223734325-b24388e019f567f","title":"I'm Colorblind and have difficulty sorting the colors.","body":"<p>You can play our colorblind mode that's designed to ease the color difficulty. Please follow these simple steps:</p><p>1- Head to the main menu of the game.</p><p>2- Tap on the settings icon at the top right corner of the screen.</p><p>3- In the settings panel, you will see the colorblind toggle button, turn it on.</p>","description":"You can play our colorblind mode that's designed to ease the color difficulty. Please follow these simple steps:1- Head to the main menu of ...","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/faq/1678/?p=ios","aria_label":"Article link to I'm Colorblind and have difficulty sorting the colors. from section Settings link"}],"publish_id":"319","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/section/319/?p=ios","icon":"⚙"},{"id":"algames_section_20240130224501661-7ba369430be4909","title":"Advertisements ","faqs":[{"id":"algames_faq_20240130224841931-989d0df0962882c","title":"Can I Remove Ads/No Ads in the game?","body":"<p>It's possible to disable full screen ad interruptions during gameplay (also known as interstitial ads) with a No Ads item! If you haven't purchased this item in the past, you can purchase this consumable item to disable interstitial ads for 30 days. If your time runs out, you can purchase the item again to disable interstitial ads for another 30 days.</p><p>Please note that banner ads and rewarded videos cannot be removed. You will always have the option to watch advertisements to receive extra rewards!</p><p>The Remove-Ads can be found in your main menu screen and the Remove Ads bundle in the store.&nbsp;</p><p><a href=\"https://d2duuy9yo5pldo.cloudfront.net/algames/6df53667-d1eb-4c7e-94b7-0af22acd8279.jpg\" target=\"_blank\" data-lightbox=\"true\" rel=\"nofollow\"><br><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"https://d2duuy9yo5pldo.cloudfront.net/algames/6df53667-d1eb-4c7e-94b7-0af22acd8279.jpg\" srcset=\"https://d2duuy9yo5pldo.cloudfront.net/algames/6df53667-d1eb-4c7e-94b7-0af22acd8279-t.jpg 1x, https://d2duuy9yo5pldo.cloudfront.net/algames/6df53667-d1eb-4c7e-94b7-0af22acd8279-2t.jpg 1.5x\" alt=\"\"></a></p><p>&nbsp;</p><p><strong>Update:</strong></p><ul><li>Before Version 2.0.58 - No Ads is permanent</li><li>Version 2.0.58 - Before Version 4.8.30 - No Ads is a 30 days consumable</li><li>Version 4.8.30 - Present - No Ads is permanent</li> </ul><p>&nbsp;</p><p><strong>Notice:</strong></p><ul><li>Purchased permanent No Ads would remain intact even with updates.</li><li>Purchased 30 days No Ads would not transition to a permanent No Ads when changes occur.</li>\n</ul>","description":"It's possible to disable full screen ad interruptions during gameplay (also known as interstitial ads) with a No Ads item! If you haven't pu...","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/faq/1681/?p=ios","aria_label":"Article link to Can I Remove Ads/No Ads in the game? from section Advertisements  link"}],"publish_id":"324","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/section/324/?p=ios"},{"id":"algames_section_20240810224925761-44d65f068f55261","title":"Technical ","faqs":[{"id":"algames_faq_20260401232812329-d003e3b1fbeea60","title":"Game Freezing / Crashing / Not Loading","body":"<div><div><div><div><div><div><p>If you’re experiencing issues while playing, please try the following troubleshooting steps:</p><ul><li>Ensure the game is up to date - Make sure you’re running the latest version</li><li>Clear your cache - Clearing cached data can help fix loading, freezing, or performance issues.</li><li>Restart your device - Rebooting your device helps refresh system processes and can resolve temporary issues affecting gameplay.</li><li>Check your connection - Make sure you’re connected to a strong Wi-Fi or mobile data signal. Try switching between Wi-Fi and mobile data to see if the issue improves.</li> </ul><div>If you are still running into problems or still require assistance after doing this, please don't hesitate to reach out to us. We'll be happy to investigate further and assist.</div></div> </div></div> </div></div> </div>","description":"If you’re experiencing issues while playing, please try the following troubleshooting steps:Ensure the game is up to date - Make sure you’re...","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/faq/3382/?p=ios","aria_label":"Article link to Game Freezing / Crashing / Not Loading from section Technical  link"}],"publish_id":"392","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/section/392/?p=ios"},{"id":"algames_section_20241219154647937-1854b567381abe7","title":"Collection","faqs":[{"id":"algames_faq_20241209074456865-d5cabfc9e74c50c","title":"What is a Collection?","body":"<p>Collections are a special, time-limited feature where you can gather cards through chests and events.</p><ul><li>You'll unlock the Collections feature after completing level 71.</li><li>Each collection lasts for two months, giving you plenty of time to collect and enjoy!</li><li>You can access collections by pressing on the cards icon on the bottom right.</li> </ul><p>&nbsp;</p><p><a href=\"https://d2duuy9yo5pldo.cloudfront.net/algames/9fde2a9a-4027-4dfe-8500-e2d1bce7bb11.gif\" target=\"_blank\" data-lightbox=\"true\" rel=\"nofollow\"><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"https://d2duuy9yo5pldo.cloudfront.net/algames/9fde2a9a-4027-4dfe-8500-e2d1bce7bb11.gif\" srcset=\"https://d2duuy9yo5pldo.cloudfront.net/algames/9fde2a9a-4027-4dfe-8500-e2d1bce7bb11.gif 1x, https://d2duuy9yo5pldo.cloudfront.net/algames/9fde2a9a-4027-4dfe-8500-e2d1bce7bb11.gif 1.5x\" alt=\"\"></a></p><p>&nbsp;</p><p>&nbsp;</p>","description":"Collections are a special, time-limited feature where you can gather cards through chests and events.You'll unlock the Collections feature a...","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/faq/2518/?p=ios","aria_label":"Article link to What is a Collection? from section Collection link"}],"publish_id":"410","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/section/410/?p=ios"}],"is_preview":false,"hc_mode":"sdkx","app_id":"algames_app_20240129201331860-8d943e1d80c24b7","featured_articles_url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/featured-articles/?p=ios","popular_articles":[{"id":"algames_faq_20250910171555974-2828058372f7ab7","title":"What is a Candy tile?","body":"<ul><li>Candy is a special tile type unlocked at level 1153.</li><li>The objective is to collect candy by making merges next to the candy machine.</li><li>Each time you merge beside the machine, a candy is produced and collected. As the candy is consumed, the machine’s stick shortens, freeing up more space on the board.</li><li>When the stick is completely used up, the candy machine disappears.</li> </ul><p><a href=\"https://d2duuy9yo5pldo.cloudfront.net/algames/a6d246d9-f989-4c5d-82b3-5470839b4b09.gif\" target=\"_blank\" data-lightbox=\"true\" rel=\"nofollow\"><img src=\"https://d2duuy9yo5pldo.cloudfront.net/algames/a6d246d9-f989-4c5d-82b3-5470839b4b09.gif\" srcset=\"https://d2duuy9yo5pldo.cloudfront.net/algames/a6d246d9-f989-4c5d-82b3-5470839b4b09.gif 1x, https://d2duuy9yo5pldo.cloudfront.net/algames/a6d246d9-f989-4c5d-82b3-5470839b4b09.gif 1.5x\" alt=\"\"> </a></p><p>&nbsp;</p><p>&nbsp;</p>","description":"Candy is a special tile type unlocked at level 1153.The objective is to collect candy by making merges next to the candy machine.Each time y...","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/faq/2979/?p=ios","aria_label":"Article link to What is a Candy tile? from section Special Tiles link","section":{"id":"algames_section_20241222035339559-4f34c09b8c29829","title":"Special Tiles","publish_id":"411","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/section/411/?p=ios"}},{"id":"algames_faq_20251001181710596-8e728b319e5e0ea","title":"What is a Mystery Card?","body":"<ul><li><strong>Mystery Cards</strong> are special, event-exclusive cards you can only earn by <strong>winning certain events</strong> (e.g., <strong>Piñata Smash</strong>, <strong>Weekly Quest</strong>, <strong>Donut Craze</strong>, <strong>Sticker Hunt</strong>).</li><li>To collect them, <strong>join, play, and win</strong> the eligible event—rewards are granted on victory.</li><li>Mystery Cards <strong>do not drop from card packs</strong> or regular gameplay; they’re <strong>event-only</strong>.</li><li>Every Mystery Card is a <strong>5-star, Ultra Rare</strong> card.</li> </ul><p style=\"text-align: center;\"><a href=\"https://d2duuy9yo5pldo.cloudfront.net/algames/d5696fa8-ad5a-45c5-844a-4db2df679796.png\" target=\"_blank\" data-lightbox=\"true\" rel=\"nofollow\"><img src=\"https://d2duuy9yo5pldo.cloudfront.net/algames/d5696fa8-ad5a-45c5-844a-4db2df679796.png\" srcset=\"https://d2duuy9yo5pldo.cloudfront.net/algames/d5696fa8-ad5a-45c5-844a-4db2df679796-t.png 1x, https://d2duuy9yo5pldo.cloudfront.net/algames/d5696fa8-ad5a-45c5-844a-4db2df679796-2t.png 1.5x\" alt=\"\"> </a></p><p></p>","description":"Mystery Cards are special, event-exclusive cards you can only earn by winning certain events (e.g., Piñata Smash, Weekly Quest, Donut Craze,...","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/faq/2987/?p=ios","aria_label":"Article link to What is a Mystery Card? from section Collection link","section":{"id":"algames_section_20241219154647937-1854b567381abe7","title":"Collection","publish_id":"410","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/section/410/?p=ios"}},{"id":"algames_faq_20251223183051847-3ac57e527efd0d6","title":"What is a Rabbit Tile?","body":"<ul><li>The Rabbit is a special tile type unlocked at level 1602.</li><li>The goal of the Rabbit tile is to collect the carrot.</li><li>To wake up the Rabbit, merge stacks next to it.</li><li>Once the Rabbit is awakened, it will reveal a carrot.</li><li>Merging stacks next to the Rabbit will clear it once the carrot is collected.</li> </ul><p>&nbsp;<a href=\"https://d2duuy9yo5pldo.cloudfront.net/algames/52cd719f-6a8c-4213-9019-e5018ca004e1.gif\" target=\"_blank\" data-lightbox=\"true\" rel=\"nofollow\"><img src=\"https://d2duuy9yo5pldo.cloudfront.net/algames/52cd719f-6a8c-4213-9019-e5018ca004e1.gif\" srcset=\"https://d2duuy9yo5pldo.cloudfront.net/algames/52cd719f-6a8c-4213-9019-e5018ca004e1.gif 1x, https://d2duuy9yo5pldo.cloudfront.net/algames/52cd719f-6a8c-4213-9019-e5018ca004e1.gif 1.5x\" alt=\"Rabbit Tile\"> </a>&nbsp;</p>","description":"The Rabbit is a special tile type unlocked at level 1602.The goal of the Rabbit tile is to collect the carrot.To wake up the Rabbit, merge s...","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/faq/3163/?p=ios","aria_label":"Article link to What is a Rabbit Tile? from section Special Tiles link","section":{"id":"algames_section_20241222035339559-4f34c09b8c29829","title":"Special Tiles","publish_id":"411","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/section/411/?p=ios"}},{"id":"algames_faq_20260506182549676-8b60bf1dd1f2cfd","title":"What is the HexaSort Official Store?","body":"<p><strong>What is the HexaSort Official Store?</strong></p><ul><li>The HexaSort Official Store is a new way to buy coins, bundles, and offers directly inside the game.</li><li>It is powered by <strong>AppCharge</strong>, a secure web-based checkout, instead of the App Store or Google Play.</li><li>Buying through the Official Store unlocks <strong>better deals</strong>, including up to 10% off on eligible items.</li> </ul><p style=\"text-align: center;\"><a href=\"https://d2duuy9yo5pldo.cloudfront.net/algames/3f039b60-f027-40cb-aeea-1ddbf9dc4160.gif\" target=\"_blank\" data-lightbox=\"true\" rel=\"nofollow\"><img src=\"https://d2duuy9yo5pldo.cloudfront.net/algames/3f039b60-f027-40cb-aeea-1ddbf9dc4160.gif\" srcset=\"https://d2duuy9yo5pldo.cloudfront.net/algames/3f039b60-f027-40cb-aeea-1ddbf9dc4160.gif 1x, https://d2duuy9yo5pldo.cloudfront.net/algames/3f039b60-f027-40cb-aeea-1ddbf9dc4160.gif 1.5x\" alt=\"\"> </a></p><h3>What is Buy Direct?</h3><ul><li><strong>Buy Direct</strong> is a toggle that lets you choose where your in-game purchases are processed.</li><li>When <strong>ON</strong>, your purchases go through the <strong>HexaSort Official Store</strong> (AppCharge).</li><li>When <strong>OFF</strong>, your purchases go through the regular <strong>App Store / Google Play</strong> flow.</li><li>The toggle is always optional — you can switch back at any time.</li> </ul><h3>Where do I find the Buy Direct toggle?</h3><ul><li>You can switch Buy Direct on or off from two places:<ul><li><strong>Settings menu</strong> → look for <strong>BUY DIRECT</strong> alongside Sounds, Notifications, Haptics, Game Boost, etc.</li><li>The <strong>Switch to AppCharge</strong> pop-up that appears when you are in the shop</li></ul> </li><li>Tap <strong>GOT IT!</strong> on the pop-up to apply your choice.</li> </ul><h3>How do I make a purchase through the Official Store?</h3><ul><li>Tap any offer in the Shop while Buy Direct is <strong>ON</strong> (or pick the Official Store option from the Switch to AppCharge pop-up).</li><li>You will be taken to the <strong>AppCharge checkout page</strong>, which shows:<ul><li>The item name and price</li><li>Your email</li><li>Your saved payment methods (Visa, Mastercard, etc.) or google pay/apple pay</li></ul> </li><li>Tap <strong>Pay</strong> to complete your purchase.</li><li>Once payment is processed, tap <strong>Return to game</strong> to head back to HexaSort with your reward delivered!</li> </ul><h3>Is paying through the Official Store safe?</h3><ul><li>Yes! <strong>AppCharge</strong> is a secure third-party payment processor that handles your card information.</li><li>HexaSort does not see or store your payment details.</li><li>You can find AppCharge's Privacy Policy, Refund Policy, and Support links at the bottom of the checkout page.</li> </ul><h3>I bought something through the Official Store but did not receive it?</h3><ul><li>If your purchase was completed but you have not received your reward, follow these steps:<ul><li>Tap on the <strong>Restore Purchases</strong> button found in the Settings menu.</li><li>If the Restore Purchases button does not fix the issue, please delete the game and reinstall it (without deleting your account).</li><li>In case that does not work either, please contact in-game chat support with the purchase receipt (found in your email) mentioning:<ul><li>Order Number</li><li>Date</li><li>Contents of Purchase</li></ul> </li></ul> </li> </ul><p></p><p></p><p></p><p style=\"text-align: left;\"></p><p></p>","description":"What is the HexaSort Official Store?The HexaSort Official Store is a new way to buy coins, bundles, and offers directly inside the game.It i...","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/faq/3451/?p=ios","aria_label":"Article link to What is the HexaSort Official Store? from section Billing link","section":{"id":"algames_section_20240129201331954-3b24ed705079e4d","title":"Billing","publish_id":"318","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/section/318/?p=ios","icon":"💰"}},{"id":"algames_faq_20240130214750199-7db0dcb3f9e9e65","title":"How do I play Hexa Sort?","body":"<ul><li>In order to complete a level, you need to place tiles to sort and merge them</li><li>You have to place similar colored hex tiles next to each other on the board to sort and stack them.</li><li>Once you have 10 tiles in a stack the stack will merge and pop</li><li>Each level gives you a new goal to achieve.</li><li>You must collect the given number of hex tiles to pass the level.</li><li>Place the same-colored tiles together and watch them stack, sort, and merge satisfyingly. The collected tiles will allow you to color &amp; build a beautiful world after completing each level.</li> </ul><p></p>","description":"In order to complete a level, you need to place tiles to sort and merge themYou have to place similar colored hex tiles next to each other o...","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/faq/1664/?p=ios","aria_label":"Article link to How do I play Hexa Sort? from section Gameplay link","section":{"id":"algames_section_20240129201331904-e1ece6570e036f6","title":"Gameplay","publish_id":"316","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/section/316/?p=ios","icon":"📚"}},{"id":"algames_faq_20250822010835952-e163f51383fd0d0","title":"How do I transfer my Progress to another device?","body":"<div data-hs-editor-attribute=\"callout\"><svg width=\"24px\" height=\"24px\" version=\"1.1\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<g stroke=\"none\" stroke-width=\"1\" fill=\"none\" fill-rule=\"evenodd\"> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <path d=\"M12,4 C13.1041722,4 14.1406202,4.20833125 15.109375,4.625 C16.0885466,5.04166875 16.9401005,5.61197555 17.6640625,6.3359375 C18.3880245,7.05989945 18.9583313,7.91145344 19.375,8.890625 C19.7916687,9.85937984 20,10.8958278 20,12 C20,13.1041722 19.7916687,14.1406202 19.375,15.109375 C18.9583313,16.0885466 18.3880245,16.9401005 17.6640625,17.6640625 C16.9401005,18.3880245 16.0885466,18.9583313 15.109375,19.375 C14.1406202,19.7916687 13.1041722,20 12,20 C10.8958278,20 9.85937984,19.7916687 8.890625 ,19.375 C7.91145344,18.9583313 7.05989945,18.3880245 6.3359375, 17.6640625 C5.61197555,16.9401005 5.04166875,16.0885466 4.625, 15.109375 C4.20833125,14.1406202 4,13.1041722 4,12 C4,10.8958278 4.20833125,9.85937984 4.625,8.890625 C5.04166875,7.91145344 5.61197555,7.05989945 6.3359375,6.3359375 C7.05989945,5.61197555 7.91145344,5.04166875 8.890625,4.625 C9.85937984,4.20833125 10.8958278,4 12,4 Z M11,7 L11,9 L13,9 L13,7 L11,7 Z M14,17 L14,16 L13,16 L13,11 L10,11 L10,12 L11,12 L11,16 L10,16 L10,17\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;L14,17 Z\" fill=\"#000000\"></path></g> </svg><div data-hs-editor-attribute=\"callout-content\"><div>Account syncing is now available for app version 4.3.02 and above.</div></div> </div><p>&nbsp;</p><p><strong>Creating a Save</strong></p><ul><li>To create your save, please access your Settings Menu (the gear icon at the top right), select \"Save Progress\" and select either Facebook\\Apple or Facebook\\Google (depending on your device you are logged into).</li> </ul><p>&nbsp;</p><p><strong>Transferring the progress to a new device</strong></p><ul><li>On your <strong>old device</strong>, open the game and go to <strong>Settings → Account</strong>.</li><li style=\"list-style-type: none;\"><ul><li style=\"list-style-type: none;\"><ul><li>Sync your progress with <strong>Facebook</strong>, <strong>Google</strong>, or <strong>Apple</strong>.</li></ul> </li> </ul><ol><li>On your <strong>new device</strong>, install and open the game.<ul><li>Go to <strong>Settings → Account</strong> and log in with the <strong>same provider</strong> you used on the old device.</li></ul> </li> </ol><p><strong>Note:</strong> If you haven’t synced your account with Facebook, Google, or Apple, your progress will only be stored locally and cannot be transferred to another device.</p></li> </ul>","description":"&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&...","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/faq/2953/?p=ios","aria_label":"Article link to How do I transfer my Progress to another device? from section Account link","section":{"id":"algames_section_20240129201331927-8044720aef6938a","title":"Account","publish_id":"317","url":"/hc-sdkx/en/app/algames_platform_20240129201332045-7e197bedd0b9c2c/section/317/?p=ios","icon":"👩🏻"}}],"lang":"en","is_sdkx":true,"is_rtl":false,"show_section_images":false,"is_vertical_navigation_sdkx":false,"translations":{"popular_articles_title":"Popular articles","recent_search_text":"Recent Searches","more_help_text":"Need more help?","chat_with_us":"Chat with us","scroll_right_text":"Scroll right","scroll_left_text":"Scroll left"}}

  /**
   * Append script tag with same source URL when a script tag fails.
   * This can happen if CDN service do not sent correct CORS header.
   * @param {Object} event - JS error event
   */
  function handleEntryJSError(event) {
    const failedScriptEl = event.target
    const failedScriptSource = failedScriptEl.getAttribute("src")

    failedScriptEl.remove()

    const script = document.createElement("script");
    script.setAttribute("src", failedScriptSource);
    document.body.appendChild(script);
  }

</script>
